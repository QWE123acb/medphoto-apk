<script>
(function () {
  var overlay = null;
  function showErr(msg) {
    if (overlay || window.__appMounted) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;color:#b91c1c;' +
      'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:system-ui';
    d.innerHTML = '<div style="font-size:18px;font-weight:700">页面加载失败</div>' +

      '<div style="font-size:12px;color:#999">请刷新重试，或联系开发者排查</div>';
    document.body.appendChild(d);
    overlay = d;
  }
  function clearErr() {
    if (window.__appMounted && overlay) {
      overlay.remove();
      overlay = null;
    }
  }
  window.addEventListener('error', function (e) {
    // 只关心脚本运行时错误，忽略资源加载失败（如 manifest 404）
    if (e.target !== window || e.message === undefined || window.__appMounted) return;
    showErr('脚本错误：' + (e.message || '未知'));
  }, true);
  // 应用挂载成功后自动撤掉错误层
  setInterval(clearErr, 300);
  var src = document.getElementById('app-src');
  try {
    var bin = atob(src.textContent.trim());
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }));
    import(url).catch(function (err) { showErr('模块加载失败：' + err.message); });
  } catch (err) {
    showErr('初始化失败：' + err.message);
  }
})();
