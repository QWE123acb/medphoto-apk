<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.55" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 全幅渐变底（maskable 安全区设计，重要图形集中在中央 80%） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>

  <!-- 相机机身 -->
  <g>
    <rect x="116" y="168" width="280" height="208" rx="36" fill="#ffffff"/>
    <!-- 取景器凸起 -->
    <path d="M186 172 l18 -34 h104 l18 34 z" fill="#ffffff"/>
    <!-- 镜头外圈 -->
    <circle cx="256" cy="272" r="64" fill="url(#lens)" stroke="#0f766e" stroke-width="14"/>
    <!-- 镜头内芯 -->
    <circle cx="256" cy="272" r="26" fill="#0d9488"/>
    <circle cx="247" cy="263" r="8" fill="#5eead4" opacity="0.9"/>
    <!-- 闪光灯 -->
    <circle cx="352" cy="204" r="11" fill="#99f6e4"/>
  </g>

  <!-- 医学十字徽章 -->
  <g>
    <circle cx="356" cy="356" r="52" fill="#ffffff"/>
    <path d="M356 322 v68 M322 356 h68" stroke="#0d9488" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
